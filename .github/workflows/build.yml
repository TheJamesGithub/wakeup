name: Build WakeUp.ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Sideloadly signs it)
        run: |
          set -o pipefail
          xcodebuild \
            -project WakeUp.xcodeproj \
            -scheme WakeUp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
          test -f build/Build/Products/Release-iphoneos/WakeUp.app/WakeUp

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WakeUp.app Payload/
          zip -qry WakeUp.ipa Payload
          ls -lh WakeUp.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: WakeUp-ipa
          path: WakeUp.ipa

      # Direct download link that never changes:
      # https://github.com/<you>/wakeup/releases/latest/download/WakeUp.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest WakeUp.ipa \
            --title "WakeUp (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Drag WakeUp.ipa into Sideloadly." \
            --latest

      # Also keep the newest .ipa and build log on a 'builds' branch (one commit, overwritten each time).
      - name: Publish to builds branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp WakeUp.ipa out/ 2>/dev/null || true
          cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA::7} (${{ job.status }})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
