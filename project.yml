name: WakeUp
options:
  bundleIdPrefix: com.huzz
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  WakeUp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Sounds
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: WakeUp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAlarmKitUsageDescription: WakeUp sets your alarms so they ring even on silent and in Focus.
        NSCameraUsageDescription: WakeUp uses the camera to scan the barcode that turns your alarm off.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huzz.wakeup
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
